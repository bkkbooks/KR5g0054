body:
  text: 洞玄靈寳道士明鏡法中法附肆八照鏡欲見形法當小開户居指向明漸閉目思想見面形初時漠漠殊無所見中宿之後漸漸洞遠自見面目思憶心中朗朗開明平旦夕日未入此時最好若日中盛明之時小閉户在灼灼中闚鏡無所見也莫在火下照鏡當以火自遠勿得過近火光若宜欲開目照鏡自視形體當在灼灼明中無所苦若欲閉目思見面形居暗向明然後見形耳照鏡大要當安卧牀思想精誠欲坐欲卧之間體翛翛當須臾之頃當有赤黄從額上出照耀一室中於是髣彿恍惚如覺如卧便自面形在光中對共相視如須即便消滅卧覺之後輒復照鏡欲卧思之如前法夕夕自見也或卧覺兩面相對或見己形兩人共伴坐或卧寢間見好神童玉女年五六歲許好衣服頭額端正見輒再拜或耳邊聞語聲天下吉凶萬事皆預知之或在壁東見壁西或卧夢照鏡或還光内視五藏照鏡當以申始立視之法明鏡九寸無令面有玼瑕正令清明左右各人一尺壽與天地同自齋謹澡盆盛井華水著下也夜照鏡宜用麻油火也自見其形分明下再拜長跪言吾與子同體今與子分形萬年乞改常與子相隨身形不衰萬年相隨受視中明鏡先視形見衆物聽聞人語聲修照鏡有三童九女侍之三童長六尺九女長五尺青腰衣青裳彩衣内紫女衣黑素女衣白皇女衣赤玉女衣紅帳上衣緗二十通明鏡君官屬將百二十人治開陽宫主人兩目童子精光相視見景知吉凶昔有摩鏡道士賃爲百姓摩鏡財責六七鏡無他法唯以藥塗拭之而鏡明有袁仲陽問之道士告明鏡之道可分形變化又能令人聦明達知方來有能令與天地諸神相見行其道得法則諸神仙皆來道士得道矣道士在石室中常當懸明鏡九寸於背後以辟衆惡又百鬼老物雖能變形而不使鏡中影變也其形在鏡中銷亡無爲害也道士摩鏡藥方出白子高經中向得摩鏡人云藥用鏥鋌邊有鐵鍠赤者好打鐵人燒鏥鋌打之即出鍛鐵亦有之名赤柤是取之於鐵臼中熟擣細篩用帛子籮過又用蛇黄亦擣細篩用生油和此二物即是藥也洞玄靈寳道士眀鏡法
